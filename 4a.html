<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Centralização - Position</title>

    <style>
        body {
            background-color: lightblue;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        .foguete {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
        }
    </style>
</head>

<body>
    <div class="foguete">🚀</div>
</body>
</html>
